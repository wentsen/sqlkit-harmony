[package]
name = "sqlkit"
version = "0.8.7"
description = "A Tauri App"
authors = [ "you" ]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sqlkit_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib"
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# This branch builds for both desktop and the open-harmony target, so tauri
# is pinned to the richerfu open-harmony fork versions and resolved through
# [patch.crates-io] below. The desktop mainline (master) keeps crates.io.
tauri = { version = "=2.8.5", features = [ "devtools" ] }
wry = { version = "=0.55.1", default-features = false }
tao = { version = "=0.35.3", default-features = false }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = [ "derive" ] }
serde_json = "1"
async-trait = "0.1"
thiserror = "1.0"
tokio = { version = "1", features = [ "full" ] }
tokio-postgres = { version = "0.7", features = [
  "with-serde_json-1",
  "with-chrono-0_4",
  "with-uuid-1"
] }
deadpool-postgres = "0.14"
mysql_async = { version = "0.34", default-features = false, features = [
  "minimal-rust",
  "rustls-tls",
  "bigdecimal",
  "rust_decimal",
  "time",
  "frunk",
  "binlog"
] }
tokio-postgres-rustls = "0.13"
rustls = { version = "0.23", default-features = false, features = [ "ring", "std", "tls12", "logging" ] }
rustls-pemfile = "2"
rustls-native-certs = "0.8"
tiberius = { version = "0.12", default-features = false, features = [
  "sql-browser-tokio",
  "tds73",
  "rustls",
  "chrono",
  "rust_decimal"
] }
tokio-util = { version = "0.7", features = [ "compat" ] }
rusqlite = { version = "0.32", default-features = false, features = [ "chrono" ] }
# C library bundling is selected by cargo features:
#   default → rusqlite/bundled (SQLite)
#   sqlcipher → rusqlite/bundled-sqlcipher (SQLCipher, encrypted SQLite)
uuid = { version = "1", features = [ "v4" ] }
tauri-plugin-store = "2"
tauri-plugin-os = "2"
# Desktop-only plugins: dialog uses rfd (GTK on Linux, no OHOS target; the
# ArkUI filePicker replaces it — porting report V5); updater and deep-link
# touch tauri::Env fields that the open-harmony branch does not expose and
# get HarmonyOS-specific replacements in Phase 2.
url = "2"
base64 = "0.22"
chrono = "0.4"
rust_decimal = { version = "1", features = [ "db-postgres" ] }
hex = "0.4"
rust_xlsxwriter = "0.64"
calamine = "0.22"

reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
  "socks",
  "stream"
] }
http = "1"
log = "0.4"
futures = "0.3"
rand = "0.8"
data-studio-agent = { git = "https://github.com/geek-fun/data-studio-agent.git", tag = "v0.2.1" }

flate2 = "1.0"
tar = "0.4"
zip = { version = "2", features = [ "deflate" ] }

toml = "0.8"
sha2 = "0.10"
hmac = "0.12"
sqlparser = "0.62"
fast-socks5 = "1.0"
percent-encoding = "2"
russh = "0.60"
hyper-util = { version = "0.1", default-features = false, features = [
  "client",
  "client-proxy",
  "client-proxy-system"
] }
axum = "0.8"
portpicker = "0.1.1"
pageant = "0.2"

[target.'cfg(not(target_env = "ohos"))'.dependencies]
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-window-state = "2"

[dev-dependencies]
mockall = "0.13"
tempfile = "3"
wiremock = "0.6"

[features]
default = [ "rusqlite/bundled" ]
# HarmonyOS build: disables the updater plugin and short-circuits every JDBC
# bridge spawn (no JVM on OHOS). Verify with: cargo check --features ohos
ohos = []
# Use SQLCipher (encrypted SQLite) instead of plain SQLite.
# Build with: cargo build --no-default-features --features sqlcipher
sqlcipher = [ "rusqlite/bundled-sqlcipher" ]

[target.'cfg(target_os = "macos")'.dependencies]
system-configuration = "0.7"

# OpenHarmony runtime: richerfu forks of the tauri open-harmony work, the exact
# combination verified on MateBook Pro (woshipm 2026-10-18 guide). Kept as a
# permanent [patch] on this branch — the desktop mainline (master) does not
# carry it. The official tauri-apps branches currently break on
# openharmony-ability: its main branch (1.0.0-beta.5, 2026-11-02) dropped the
# "webview" feature the wry branch depends on.
[patch.crates-io]
tauri = { git = "https://github.com/richerfu/tauri", rev = "c818cc1d" }
wry = { git = "https://github.com/richerfu/wry", rev = "ae8b21b5" }
tao = { git = "https://github.com/richerfu/tao", rev = "9d51be24" }
